# The gate this repo did not have (#57).
#
# Development here lands as direct commits to `main`, so there is no review step
# and no PR check — the suite only ever ran where somebody remembered to run it.
# Three broken commits reached `main` in three days that way. This runs it on
# every push and every pull request instead.
#
# It installs ONLY the gateway dependencies (`.[dev]`). That is deliberate and it
# is what makes the job fast and honest: `src/atr_serving/` is dependency-light by
# design, the engine venvs (torch, kraken, transformers) exist precisely so their
# pins never enter this tree, and the test suite is written to run without them.
# If a test starts needing torch, that is a design regression worth failing on.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push supersedes an in-flight run for the same ref.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # asterAIx ships 3.12 only (docs/asteraix-environment.md); CI matches the
          # box rather than the newest release, so a green run means something here.
          python-version: "3.12"
          cache: pip

      - name: Install gateway dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the test suite
        # pythonpath (src, ., engines) comes from pyproject, so `pytest` alone
        # reproduces exactly what a developer runs locally.
        run: pytest -q

      - name: Lint
        # Now a gate, which it could not be while `ruff>=0.4` let CI float to a
        # newer ruff than the tree was cleaned against — 0.16.2 selects rules
        # 0.15 does not, and the first CI run reported 125 errors against a tree
        # that was clean locally. The version is pinned in `[dev]`, so this step
        # judges the same rules the author ran. Bumping the pin is the commit
        # where those 125 get dealt with.
        run: ruff check .
