name: Model Discovery

on:
  schedule:
    # Weekly every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (propose nothing)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write       # push the catalogue branch (#116)
  pull-requests: write  # propose the catalogue as a PR (#116)
  actions: write        # start test.yml on the proposed branch (#255)

jobs:
  discover:
    runs-on: ubuntu-latest
    # Was 30, and every scheduled run between 2026-07-13 and 2026-08-03 was killed
    # at the limit by an unbounded 429 retry (#58). With the retry bounded and the
    # pagination capped, a run that takes longer than 10 minutes is broken.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script exits 1 without requests. It has been finding a preinstalled
      # copy on ubuntu-latest — a runner-image detail, not a contract.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Discover models
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          # Anonymous hub calls are rate-limited per IP, and every GitHub-hosted
          # runner shares one — which is why the schedule hit 429s where a local
          # run never did. Optional: without the secret the script still runs,
          # bounded, and reports what it could not reach (#58).
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # Not --dry-run: that only prints, so the report files the next step
        # reads were never written and config/discovered.yaml never changed —
        # it stayed `candidates: []` while #66 listed 206 (#116).
        run: >
          python scripts/discover_models.py
          --out discovery_report.json
          --md discovery_report.md

      # The catalogue is proposed, not committed: a verdict is recorded by hand
      # in that file, and a weekly run must not land on main without review.
      # One rolling branch and one open PR, updated in place. A PR opened with
      # GITHUB_TOKEN starts no other workflow, so the script starts test.yml on
      # the branch itself (workflow_dispatch is the exception), and it refuses to
      # propose a catalogue the gateway's loader would not read (#255). The
      # repository must allow Actions to create PRs (Settings → Actions →
      # General).
      - name: Propose the catalogue as a PR
        if: inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The PR text is the weekly report (#112): what arrived that could be a
        # base, listed, and the rest counted. The rolling issue it replaced (#66)
        # has been closed since 21.09.2026, and the step that wrote it skipped
        # every run that had triaged its arrivals already.
        run: python scripts/propose_catalogue.py
