[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serving-atr-inference"
version = "0.1.0"
description = "Flexible ATR/OCR/HTR inference gateway serving many model families behind one API"
requires-python = ">=3.11"
license = { text = "MIT" }
# Gateway deps ONLY. No ML libraries here — those live in the per-engine venvs.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# requests is a *test* dependency, not a gateway one: scripts/discover_models.py
# needs it, and without it tests/test_discover_models*.py fail at collection and
# take the whole run down with them — which is why every local run used --ignore
# on those two files until #57.
dev = ["pytest>=8.0", "ruff>=0.4", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "engines"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# These reach `scripts/` by inserting the repo root on sys.path, which has to
# happen before the import it enables. pytest's own `pythonpath` setting covers
# the normal run; the guard is there so the file also works under plain python.
"tests/test_discover_models*.py" = ["E402"]
