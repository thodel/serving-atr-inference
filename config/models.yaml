  # ── Kraken (page; segments internally) ────────────────────────────────────
  # ── Kraken models — full Zenodo registry (port from agentic_historian/agent_a/models.py) ──
  # Sourced from KRAKEN_MODELS (38 entries). Full registry tracked in ISSUE-02.

  # ── Kraken (page; segments internally) ────────────────────────────────────
  # Every id below is named after the Zenodo record its DOI loads, and the
  # languages/scripts/centuries are that record's — empty where the record says
  # nothing. The previous names came from a catalogue that paired real DOIs with
  # invented descriptions (agentic_historian KRAKEN_MODELS): 28 of 43 entries
  # named a model other than the one they loaded, e.g. 'kraken-catmus_caroline'
  # for a Hebrew Sephardi model. `scripts/audit_registry.py --check` guards this;
  # it must stay at zero mismatches (#101).
  #
  # `base_model` records a DOI when the record says the model is a fine-tune of
  # another model served here — four of these descend from CATMuS Medieval. Two
  # such models are NOT independent candidates in an ensemble, however different
  # their ids look. `training_datasets` records the ground truth the record names;
  # the three Inzigkofen hands were trained on a corpus this project benchmarks
  # against, so scoring them on Inzigkofen would report memorisation as
  # recognition (the FoNDUE-GD lesson, #100).

  # FoNDUE-GD — Simon Gabay, Université de Genève, 2026. A large multilingual model
  # aggregating 28 published corpora; the widest coverage in this registry, and
  # the reason training_datasets is recorded: two of those corpora are test sets
  # this project measures on, which is not visible from the model's name.
  - id: kraken-fondue_gd_v2
    engine: kraken
    zenodo_id: "10.5281/zenodo.21536798"
    task: htr
    level: page
    languages: [fr, de, es, la, nl]
    scripts: [Latn]
    centuries: [16, 17, 18, 19, 20, 21]
    training_datasets:
      - https://doi.org/10.5281/zenodo.4746342
      - https://github.com/PonteIneptique/valais-recensement
      - https://doi.org/10.5281/zenodo.5153262
      - https://doi.org/10.5281/zenodo.3517776
      - https://doi.org/10.5281/zenodo.7695130
      - https://doi.org/10.5281/zenodo.3945087
      - https://github.com/FoNDUE-HTR/FONDUE-DE-MSS-18
      - https://github.com/FoNDUE-HTR/FONDUE-DE-AAEB-17
      - https://github.com/FoNDUE-HTR/FONDUE-FR-MSS-19
      - https://github.com/FoNDUE-HTR/FONDUE-FR-MSS-18
      - https://github.com/HTR-United/CREMMA-MSS-18
      - https://github.com/HTR-United/CREMMA-MSS-20
      - https://github.com/HTR-United/cremma-wikipedia
      - https://github.com/HTR-United/lectaurep-repertoires
      - https://github.com/HTR-United/lectaurep-bronod
      - https://github.com/HTR-United/CREMMA-AN-TestamentsDePoilus
      - https://github.com/HTRomance-Project/modern-roman-languages
      - https://github.com/Proyecto-Ocupacion-Araucania-UChile/HTR_Araucania_XIX
      - https://github.com/16thExegesisDH/HTR-Corpus-A
      - https://github.com/16thExegesisDH/HTR-Corpus-C
      - https://github.com/ARCHEO-POL/OCR_corpus_principal
      - https://github.com/Masculinites-Esclavagistes/MEGV-FR-MSS-18
      - https://github.com/PaulineJac/GasparoSardiToponomasia
      - https://github.com/alix-tz/moonshines
      - https://github.com/alix-tz/peraire-ground-truth
      - https://github.com/FoNDUE-HTR/FoNDUE_Wolfflin_Fotosammlung
