# ATR model registry — single source of truth for /models.
#
# Each entry is a ModelSpec (see src/atr_serving/registry.py). The gateway only
# reads this file; engines load the weights. Selection (script/lang/century ->
# model) is done client-side by agentic_historian/model_selector.py against this
# metadata.
#
# residency:  pinned = always resident; lazy = load on first request, LRU-evict.
# gpu_affinity: fixed GPU index, or null = ModelManager decides.
# vram_mb: the weights, in MiB. Since #127 it sizes every vLLM launch —
#   `--gpu-memory-utilization = min(vram_mb x 1.6, free - 2048) / total` — so a
#   wrong value fails in both directions: too low and vLLM dies computing a KV
#   cache a minute into the load, too high and a launch is refused or a resident
#   model evicted for nothing.
#
#   Every value below was estimated, none measured (#130). An entry that HAS been
#   measured carries `vram_measured:` beside it, with the host and date; absence
#   of that block means the number is somebody's guess. Measure one with
#
#       python scripts/measure_vram.py --model <id> --write
#
#   on the serving box, against the running gateway. `--report` shows what is
#   measured so far; `--check` (also a test) fails when a measured entry and its
#   vram_mb have drifted apart.
#
# idhefix placement (see docs/idhefix-environment.md): GPU 0 is SHARED with a
# live RAG service (~10 GB), GPU 1 is free. Default everything to GPU 1; the
# ModelManager uses GPU 0 only as overflow when nvidia-smi shows room.

models:
  # ── VLM OCR — served by vLLM (subprocesses managed by ModelManager) ───────
  # GPU 1 only (GPU 0 is the shared RAG GPU). LightOnOCR is pinned + line-level;
  # the two 8B Qwen fine-tunes are lazy (one resident at a time, LRU-evicted).
  - id: lightonocr-catmus-caroline
    engine: vllm
    hf_repo: wjbmattingly/LightOnOCR-2-1B-catmus-caroline
    base_model: lightonai/LightOnOCR-2-1B-base
    task: ocr
    level: line          # LightOnOCR expects cropped line images, not full pages
    languages: [la]
    scripts: [Caroline]
    centuries: [9, 10, 11, 12]
    vram_mb: 3000
    residency: pinned
    gpu_affinity: 1

  - id: qwen3vl-8b-old-church-slavonic
    engine: vllm
    hf_repo: wjbmattingly/Qwen3-VL-8B-old-church-slavonic-line-3-epochs
    base_model: Qwen/Qwen3-VL-8B-Instruct
    task: ocr
    level: line          # "line-3-epochs" — trained on line crops
    languages: [cu]
    scripts: [Cyrillic, Glagolitic]
    centuries: [10, 11, 12, 13, 14]
    vram_mb: 18000
    residency: lazy
    gpu_affinity: 1

  - id: qwen3vl-8b-hebrew
    engine: vllm
    hf_repo: wjbmattingly/Qwen3-VL-8B-hebrew-3-epochs
    base_model: Qwen/Qwen3-VL-8B-Instruct
    task: ocr
    level: page          # full-page input
    languages: [he]
    scripts: [Hebrew]
    centuries: [13, 14, 15, 16, 17, 18]
    vram_mb: 18000
    residency: lazy
    gpu_affinity: 1

  # ── dh-unibe German XIX fine-tunes (our own, trained by the training service) ──
  # Three adapters over three different bases, trained on the SAME material and the
  # SAME instruction, so a run over one corpus compares the bases rather than the
  # data. `prompt` is the instruction they were trained with, verbatim: serving
  # them with different wording is a silent distribution shift, and their own model
  # cards say so.
  #
  # `level: page` was taken for a deployment decision here: they were trained on
  # line crops (`granularity: line`), and page-level serving asks them to read a
  # whole page in one call — the cheaper shape, one request per page, and no
  # dependency on the kraken segmenter. **Measurement has since settled it the
  # other way** (#165, docs/VLM_TRAINING.md): a line-trained model returns a
  # fragment for a page, silently. qwen3vl-german-xix-v2 reads 15 of its own
  # validation pages at CER 0.98 with a length ratio of 0.02; medieval-german-v3
  # answered every one of 14 pages with "de". Both are served `level: line` now.
  # v1 below is the one entry of this family still on `level: page`, and it has
  # not been measured — see its own comment.
  #
  # It has one sharp edge: a page is many times more output than a line, and vLLM
  # stops at `ATR_VLLM_MAX_NEW_TOKENS` (512) without saying so. Raise it well above
  # a page's worth of text before serving these — see docs/GERMAN_XIX_MODELS.md.
  #
  # All three are LoRA adapters on PRIVATE hub repos. Two consequences for the box:
  # `HF_TOKEN` must be set before the weights can be pulled at all, and vLLM 0.11
  # refuses LoRA on the vision tower — so each one must be baked into its base with
  # `scripts/merge_loras.py` before it is servable. See docs/GERMAN_XIX_MODELS.md.
  #
  # vram_mb covers the merged bf16 weights plus KV cache; all three are `lazy`, so
  # GPU 1 holds one at a time. A caller that wants to compare them should therefore
  # run model-major (all pages of one model, then the next) — page-major evicts and
  # reloads on every page.
  - id: qwen3vl-german-xix-v1
    engine: vllm
    hf_repo: dh-unibe/qwen3vl-german-xix-v1
    base_model: Qwen/Qwen3-VL-4B-Instruct
    task: htr
    # Measured 2026-09-23 with scripts/eval_granularity.py on 15 validation pages
    # of its own UBELIX run (20260911T114344Z, 542 lines; the same five-per-source
    # selection used for v2, so the two are comparable): lines 0.0475 at length
    # ratio 1.00, paragraphs 0.976, whole pages 1.24 at length ratio 0.37 with 14
    # of 15 collapsed. A page of 900-1500 characters comes back as 1-20: "die",
    # "dießmal die", once a single quotation mark. Same as its v2 and as
    # medieval-german-v3 — a line-trained model stops after one line.
    #
    # Its 0.0475 on lines is NOT comparable to v2's 0.052: v1's own validation
    # split carries the truncated ground truth of #125, which is also why the
    # federal benchmark, whose text is correct, gives it 0.2551 against v2's
    # 0.0765. The page result needs no such caveat: 1-20 characters for a page is
    # not something a corpus bug produces.
    level: line          # measured: it reads lines, not pages (#165)
    prompt: Transcribe the handwritten text in this image exactly as written.
    languages: [de]
    scripts: [Kurrent]
    centuries: [19]
    vram_mb: 12000
    residency: lazy
    gpu_affinity: 1
    training_datasets:
      - https://huggingface.co/datasets/dh-unibe/image-text_zh-regierungsratsprotokolle
      - https://huggingface.co/datasets/dh-unibe/image-text_parlamentsdienste-protokolle
      - https://huggingface.co/datasets/dh-unibe/image-text_nr-sr-vereinigte-bundesversammlung-xix
      - https://huggingface.co/datasets/dh-unibe/image-text_kurrent-xix

  # v2 replaces v1, and the reason is worth keeping: v1 was trained on a corpus
  # whose PageXML converter had truncated lines to their first word — 6.35x the
  # characters of nr-sr-vereinigte-bundesversammlung-xix and 4.54x of
  # parlamentsdienste-protokolle — so it learned to write the first word and
  # stop. On the published federal-minutes benchmark it wrote little more than
  # that on 507 of 2751 lines (18.4%) and scored CER 0.2551. v2 is the same four
  # repositories, the same seed and the same split after the converter fix, and
  # collapses on none of them: **CER 0.0765 on 2751 held-out lines**, no document
  # shared with training (Hodel & Schoch 2021, doi:10.5281/zenodo.4746342).
  #
  # Served `level: line` since 2026-09-22 (#165): kraken segments, the model reads
  # one line per call, and it performs as measured. It was registered
  # `level: page` (#154) — one call per page — on the caveat that 0.0765 is a
  # LINE-level number. The page shape was then measured with
  # scripts/eval_granularity.py on 15 validation pages of its own run: lines 0.052,
  # whole pages 0.98 with a length ratio of 0.02 — each page came back as one
  # plausible German line of 17-60 characters, often not on the page ("Hochzeitlich
  # in der Stadt"). A model trained on line crops learned to stop after one line;
  # no pixel budget changes that. At `level: line` the default visual budget is
  # the 262144 it trained at, so no `max_pixels` override is needed.
  - id: qwen3vl-german-xix-v2
    engine: vllm
    hf_repo: dh-unibe/qwen3vl-german-xix-v2
    base_model: Qwen/Qwen3-VL-4B-Instruct
    task: htr
    level: line          # it reads lines, not pages (#165)
    prompt: Transcribe the handwritten text in this image exactly as written.
    languages: [de]
    scripts: [Kurrent]
    centuries: [19]
    vram_mb: 12000
    residency: lazy
    gpu_affinity: 1
    training_datasets:
      - https://huggingface.co/datasets/dh-unibe/image-text_zh-regierungsratsprotokolle
      - https://huggingface.co/datasets/dh-unibe/image-text_parlamentsdienste-protokolle
      - https://huggingface.co/datasets/dh-unibe/image-text_nr-sr-vereinigte-bundesversammlung-xix
      - https://huggingface.co/datasets/dh-unibe/image-text_kurrent-xix

  # The most accurate 19th-century model: CER 0.0680 on all 2,751 lines of the
  # Federal Council test set (doi:10.5281/zenodo.4746342, no document shared with
  # training), against 0.0765 for qwen3vl-german-xix-v2 and 0.3596 for its own v1,
  # which it replaces. Same four corpora, same seed and split as the Qwen3-VL v2;
  # trained on UBELIX (docs/UBELIX_PLAN.md §24).
  #
  # Served from .venvs/vllm-next (vLLM 0.29 cu129, transformers 5.17): vLLM 0.11
  # does not know Qwen3.5, and the cu129 build runs on this box's driver 565 where
  # the default cu130 build does not (#132, measured 2026-09-21). Every other vLLM
  # model stays on .venvs/vllm.
  #
  # `level: line`, and that is a measurement rather than a preference. It was
  # registered `level: page` like qwen3vl-german-xix-v2, so that a corpus run
  # would compare the two bases and nothing else, with the standing caveat that
  # 0.0680 is a LINE-level number on line crops at 262144 pixels — the reason to
  # expect good page readings, not evidence of them.
  #
  # The evidence arrived on 2026-09-21. Whole-page over 27 Lassberg letters it
  # averaged 335 characters against trocr-kurrent's 844 on the same collection,
  # and the readings are fragments: "1841" (4 chars), "den 14. April 1849."
  # (19), "der Böhne, der von der Hrn. Prof. von Hrn. Prof." — correct German,
  # one line of a full page. One page degenerated into "1000000000…" for the
  # whole 4096-token ceiling. That is not a resolution problem that a larger
  # `max_pixels` would fix; it is a model outside the distribution it was
  # trained on, and it is the same way qwen3vl-german-xix-v1 failed here.
  #
  # So it is served the way it was measured: kraken segments, the model reads one
  # line per call. The cost is one request per line instead of per page.
  - id: qwen3.5-4b-german-xix-v2
    engine: vllm
    vllm_venv: vllm-next
    max_num_seqs: 64     # hybrid model: at vLLM's 256 it does not start (see ModelSpec)
    hf_repo: dh-unibe/qwen3.5-4b-german-xix-v2
    base_model: Qwen/Qwen3.5-4B
    task: htr
    level: line          # the configuration its 0.0680 was measured in
    prompt: Transcribe the handwritten text in this image exactly as written.
    languages: [de]
    scripts: [Kurrent]
    centuries: [19]
    vram_mb: 12000
    residency: lazy
    gpu_affinity: 1
    training_datasets:
      - https://huggingface.co/datasets/dh-unibe/image-text_zh-regierungsratsprotokolle
      - https://huggingface.co/datasets/dh-unibe/image-text_parlamentsdienste-protokolle
      - https://huggingface.co/datasets/dh-unibe/image-text_nr-sr-vereinigte-bundesversammlung-xix
      - https://huggingface.co/datasets/dh-unibe/image-text_kurrent-xix

  - id: qwen3.5-4b-german-xix-v1
    engine: vllm
    # Disabled 2026-09-14 because Qwen3.5 could not be merged or served on this box
    # (#132); that was lifted on 2026-09-21 by .venvs/vllm-next. It stays disabled
    # because it is superseded: trained on the truncated corpus (#125), replaced by
    # its v2. Kept registered so readings made with it remain explicable.
    enabled: false
    disabled_reason: >-
      Superseded: trained on the corpus with truncated lines (#125) and scores
      CER 0.36 on the Federal Council benchmark; use its v2. Not merged. Qwen3.5
      as such is servable here since 2026-09-21 through .venvs/vllm-next (#132).
    hf_repo: dh-unibe/qwen3.5-4b-german-xix-v1
    base_model: Qwen/Qwen3.5-4B
    task: htr
    level: page          # not measured on pages; disabled, and its v2 reads lines (#165)
    prompt: Transcribe the handwritten text in this image exactly as written.
    languages: [de]
    scripts: [Kurrent]
    centuries: [19]
    vram_mb: 12000
    residency: lazy
    gpu_affinity: 1
    training_datasets:
      - https://huggingface.co/datasets/dh-unibe/image-text_zh-regierungsratsprotokolle
      - https://huggingface.co/datasets/dh-unibe/image-text_parlamentsdienste-protokolle
      - https://huggingface.co/datasets/dh-unibe/image-text_nr-sr-vereinigte-bundesversammlung-xix
      - https://huggingface.co/datasets/dh-unibe/image-text_kurrent-xix

  - id: qwen3.5-2b-german-xix-v1
    engine: vllm
    # Disabled 2026-09-14 because Qwen3.5 could not be merged or served on this box
    # (#132); that was lifted on 2026-09-21 by .venvs/vllm-next. It stays disabled
    # because it is superseded: trained on the truncated corpus (#125), replaced by
    # its v2. Kept registered so readings made with it remain explicable.
    enabled: false
    disabled_reason: >-
      Superseded: trained on the corpus with truncated lines (#125) and scores
      CER 0.29 on the Federal Council benchmark; use its v2. Not merged. Qwen3.5
      as such is servable here since 2026-09-21 through .venvs/vllm-next (#132).
    hf_repo: dh-unibe/qwen3.5-2b-german-xix-v1
    base_model: Qwen/Qwen3.5-2B
    task: htr
    level: page          # not measured on pages; disabled, and its v2 reads lines (#165)
    prompt: Transcribe the handwritten text in this image exactly as written.
    languages: [de]
    scripts: [Kurrent]
    centuries: [19]
    vram_mb: 7000
    residency: lazy
    gpu_affinity: 1
    training_datasets:
      - https://huggingface.co/datasets/dh-unibe/image-text_zh-regierungsratsprotokolle
      - https://huggingface.co/datasets/dh-unibe/image-text_parlamentsdienste-protokolle
      - https://huggingface.co/datasets/dh-unibe/image-text_nr-sr-vereinigte-bundesversammlung-xix
      - https://huggingface.co/datasets/dh-unibe/image-text_kurrent-xix

  # ── Pre-1600 German — the one line model this box has for those hands ─────
  #
  # Registered on 2026-09-29 for the Berner Disputation manuscripts (Staatsarchiv
  # Bern A V 1443-1447), which the xix models cannot read: they were trained on
  # 19th-century Kurrent and this is 1528. The four corpora behind this one are
  # the Zurich Rats- und Richtebücher XV-XVI, the Bullinger autographs, the
  # Königsfelden charters post-1500 and AAEB XIV-XVII — the same decades and in
  # part the same hands, the Bullinger set holding Berchtold Haller and Eberhard
  # von Rümlang, who wrote and copied at that disputation.
  #
  # `level: line` is measured, not assumed. `scripts/eval_granularity.py` on its
  # 14 held-out pages, 2026-09-22 (#165): CER 0.111 on line crops, 1.00 on whole
  # pages, where every page came back as "de" or "te" at a length ratio of 0.001.
  # Its own card reports CER 0.112 over 200 validation samples, and says that is
  # mostly in-domain rather than a held-out-hands benchmark — so for a Bern hand
  # neither number is a promise, and the run has to be looked at.
  - id: qwen3vl-medieval-german-v3
    engine: vllm
    hf_repo: dh-unibe/qwen3vl-medieval-german-v3
    base_model: Qwen/Qwen3-VL-4B-Instruct
    task: htr
    level: line          # CER 0.111 on lines, 1.00 on pages (#165)
    # The budget belongs to the fine-tune, not to the box it happens to run on.
    # idhefix has ATR_VLLM_MAX_NEW_TOKENS=4096 in its .env — raised for the
    # page-level experiment (#154) and never lowered when #165 put every model
    # back on lines — so without this a LINE call carries eight times the code
    # default of 512. Measured on the Schöni sample, 29.09.2026: 4 of 25 pages
    # held a line that degenerated into a digit run and used the whole 4096,
    # ~4100 characters for one line of a manuscript page. 512 does not stop a
    # model from looping; it stops a loop from being expensive and invisible.
    max_new_tokens: 512
    prompt: Transcribe the handwritten text in this image exactly as written.
    languages: [de]
    scripts: [Kurrent]
    centuries: [15, 16, 17]
    vram_mb: 12000
    residency: lazy
    gpu_affinity: 1
    training_datasets:
      - https://huggingface.co/datasets/dh-unibe/image-text_rats-und-richtebuecher_xv-xvi
      - https://huggingface.co/datasets/dh-unibe/image-text_bullinger-autoren
      - https://huggingface.co/datasets/dh-unibe/image-text_koenigsfelden-charters-post-1500
      - https://huggingface.co/datasets/dh-unibe/image-text_aaeb-xiv-xvii

  # ── Party HTR — its own always-on service (runs for every image) ──────────
  - id: party
    engine: party
    zenodo_id: "10.5281/zenodo.20642057"
    task: htr
    level: page
    languages: [mul]
    scripts: [Medieval]
    centuries: [13, 14, 15, 16]
    vram_mb: 2000
    residency: pinned
    gpu_affinity: 1

  # ── TrOCR (line-level, vision-encoder-decoder seq2seq) ────────────────────
  - id: trocr-medieval-escriptmask
    engine: trocr
    hf_repo: dh-unibe/trocr-medieval-escriptmask
    task: htr
    level: line
    languages: [de, fr, la, nl]
    scripts: [Medieval]
    centuries: [13, 14, 15, 16]
    vram_mb: 1500
    residency: pinned
    gpu_affinity: 1

